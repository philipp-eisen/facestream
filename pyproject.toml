[project]
name = "facestream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "huggingface-hub>=0.27.1",
    "insightface==0.7.3",
    "numpy<2",
    "onnx==1.16.0",
    "onnxruntime-gpu==1.16.3; sys_platform != 'darwin'",
    "onnxruntime-silicon==1.16.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "opencv-python>=4.11.0.86",
    "torch==2.0.1",
    "torchvision==0.15.2",
    "aiortc>=1.9.0",
    "fastapi>=0.115.6",
    "opencv-python>=4.11.0.86",
    "uvicorn>=0.30.1",
]

[tool.uv]
default-groups = ["dev"]


[tool.ruff.lint]
extend-select = ["I", "E4", "E7", "E9", "F", "FAST", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on the path so test_browser.py can import the shared helpers.
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "browser: needs Chromium and the stub backend (deselect with -m 'not browser')",
]


[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "modal>=1.3.0.post1",
    "ruff>=0.9.3",
    "uv>=0.5.24",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-aiohttp>=1.0.5",
    "playwright>=1.49.1",
    # uvicorn needs a websocket implementation for the test stub backend.
    "wsproto>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facestream"]
